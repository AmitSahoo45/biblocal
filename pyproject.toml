[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "biblocal"
version = "0.1.0"
description = "Offline CPU-only race bib tagging"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "MODELS.md"]
authors = [{name = "Amit Sahoo"}]
requires-python = ">=3.12"
dependencies = ["rapidocr==3.10.0", "onnxruntime==1.31.0", "pillow>=10.1"]

[project.scripts]
biblocal = "biblocal.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["exiftool: needs exiftool on disk"]
addopts = "--basetemp=.pytest_tmp"
